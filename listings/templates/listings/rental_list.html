<h1>Rental Listings</h1>
<a href="{% url 'create_rental' %}">Create New Rental</a>
<ul>
    {% for rental in rentals %}
        <li>
            <a href="{% url 'rental_detail' rental.id %}">{{ rental.title }}</a>
            - <a href="{% url 'update_rental' rental.id %}">Update</a>
            - <a href="{% url 'delete_rental' rental.id %}">Delete</a>
        </li>
    {% endfor %}
</ul>
