<!-- chatbox.html -->
<div id="chatbox" style="position: fixed; bottom: 20px; right: 20px; width: 300px; height: 400px; background: #f1f1f1; border: 1px solid #ccc; display: none;">
    <div id="chatbox-header" style="background: #333; color: white; padding: 10px;">
        <span>Chat</span>
        <button onclick="toggleChatbox()">Close</button>
    </div>
    <select id="recipientSelect" style="width: 100%; padding: 5px; margin: 5px 0;">
        <option value="" disabled selected>Select recipient</option>
        {% for user in users %}
            <option value="{{ user.id }}">{{ user.username }}</option>
        {% endfor %}
    </select>
    <div id="chatbox-messages" style="height: 250px; overflow-y: auto; padding: 10px;">
        <!-- Chat messages will go here -->
    </div>
    <input type="text" id="chatbox-input" placeholder="Type a message..." style="width: 100%; padding: 10px;">
</div>


<button onclick="toggleChatbox()" style="position: fixed; bottom: 20px; right: 20px;">Open Chat</button>

<script>
    function toggleChatbox() {
        const chatbox = document.getElementById('chatbox');
        chatbox.style.display = chatbox.style.display === 'none' ? 'block' : 'none';
    }

    document.getElementById("chatbox-input").addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            sendMessage(event.target.value);
            event.target.value = "";
        }
    });

    const chatSocket = new WebSocket('ws://' + window.location.host + '/ws/chat/');

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        const messagesDiv = document.getElementById("chatbox-messages");
        const newMessage = document.createElement("div");
        newMessage.textContent = data.message;
        messagesDiv.appendChild(newMessage);
    };

    chatSocket.onclose = function(e) {
        console.error('Chat socket closed unexpectedly');
    };

    function sendMessage(message) {
        // Get the selected recipient ID
        const recipientId = document.getElementById("recipientSelect").value;

        if (!recipientId) {
            alert("Please select a recipient.");
            return;
        }
        // Display the sent message in the chatbox
        const messagesDiv = document.getElementById("chatbox-messages");
        const newMessage = document.createElement("div");
        newMessage.textContent = message;
        messagesDiv.appendChild(newMessage);

        // TODO: Send message to the server via WebSocket
        chatSocket.send(JSON.stringify({
            'message': message,
            'recipient_id': recipientId
        }));
    }
</script>
