{% extends 'chatbot/base.html' %}

{% block content %}
<div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <h1>Neighborhood Chatbot</h1>
        <p>Ask questions about your neighborhood</p>
        <div class="quick-questions">
            <button class="quick-question-btn" data-question="walkability">Walkability</button>
            <button class="quick-question-btn" data-question="crime">Crime</button>
            <button class="quick-question-btn" data-question="trains nearby">Trains Nearby</button>
            <button class="quick-question-btn" data-question="schools nearby">Schools Nearby</button>
            <button class="quick-question-btn" data-question="restaurants nearby">Restaurants Nearby</button>
        </div>
    </div>

    <!-- Messages container -->
    <div class="chat-window" id="chat-window">
        <div class="messages" id="messages">
            {% for message in messages %}
                <div class="message-wrapper {% if not message.is_bot %}message-right{% endif %}">
                    <div class="message {% if message.is_bot %}bot-message{% else %}user-message{% endif %}">
                        {{ message.message }}
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
        <select id="borough-select" class="form-control">
            <option value="" disabled selected>Select a borough</option>
            <option value="Manhattan">Manhattan</option>
            <option value="Brooklyn">Brooklyn</option>
            <option value="Queens">Queens</option>
            <option value="Bronx">Bronx</option>
            <option value="Staten Island">Staten Island</option>
        </select>
        <select id="neighborhood-select" class="form-control" disabled>
            <option value="" disabled selected>Select a neighborhood</option>
        </select>
        <input 
            type="text" 
            id="user-input" 
            placeholder="Ask about your neighborhood..."
        >
        <button id="send-btn">
            Send
            <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
</div>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    background-color: #f0f2f5;
    padding: 20px;
}

.chat-container {
    max-width: 1000px;
    margin: 20px auto;
    height: 800px; /* Fixed height */
    display: flex;
    flex-direction: column;
    background: white;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    border-radius: 10px;
}

.chat-header {
    padding: 16px;
    border-bottom: 1px solid #e5e7eb;
    background: white;
    border-radius: 10px 10px 0 0;
}

.chat-header h1 {
    font-size: 20px;
    color: #1a1a1a;
    margin-bottom: 4px;
}

.chat-header p {
    color: #666;
    font-size: 14px;
}

.chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #fff;
}

.messages {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.message-wrapper {
    display: flex;
}

.message-right {
    justify-content: flex-end;
}

.message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.4;
}

.bot-message {
    background: #f1f1f1;
    color: #1a1a1a;
}

.user-message {
    background: #0084ff;
    color: white;
}

.input-area {
    padding: 16px;
    border-top: 1px solid #e5e7eb;
    background: white;
    display: flex;
    gap: 20px;
    border-radius: 0 0 10px 10px;
}

#user-input {
    flex: 1;
    padding: 10px 16px;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
}

#user-input:focus {
    border-color: #0084ff;
}

#send-btn {
    background: #0084ff;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 20px;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background-color 0.2s;
}

#send-btn:hover {
    background: #0073e6;
}

.send-icon {
    width: 16px;
    height: 16px;
}

/* Custom scrollbar */
.chat-window::-webkit-scrollbar {
    width: 6px;
}

.chat-window::-webkit-scrollbar-track {
    background: #f1f1f1;
}

.chat-window::-webkit-scrollbar-thumb {
    background: #c1c1c1;
    border-radius: 3px;
}

.chat-window::-webkit-scrollbar-thumb:hover {
    background: #a8a8a8;
}

/* Message animations */
@keyframes messageAppear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message-wrapper {
    animation: messageAppear 0.3s ease-out;
}

#neighborhood-select {
    width: 180px;
    padding: 10px;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
}

.quick-question-btn {
    background-color: #0084ff;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    margin-right: 8px;
    transition: background-color 0.2s;
}

.quick-question-btn:hover {
    background-color: #0073e6;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const input = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const messages = document.getElementById('messages');
    const chatWindow = document.getElementById('chat-window');
    const boroughSelect = document.getElementById('borough-select');
    const neighborhoodSelect = document.getElementById('neighborhood-select');
    const quickQuestionButtons = document.querySelectorAll('.quick-question-btn');

    const neighborhoods = {
        "Manhattan": ["Battery Park City", "Carnegie Hill", "Chelsea", "Chinatown", "East Harlem", "East Village", "Financial District", "Flatiron District", "Gramercy Park", "Greenwich Village", "Harlem", "Hell's Kitchen", "Inwood", "Kips Bay", "Lenox Hill", "Lower East Side", "Manhattan Valley", "Midtown", "Morningside Heights", "Murray Hill", "NoHo", "Nolita", "SoHo", "Tribeca", "Upper East Side", "Upper West Side", "Washington Heights", "West Village"],
        "Brooklyn": ["Bedford-Stuyvesant", "Bensonhurst", "Boerum Hill", "Brooklyn Heights", "Bushwick", "Canarsie", "Carroll Gardens", "Clinton Hill", "Coney Island", "Crown Heights", "DUMBO", "Downtown Brooklyn", "East New York", "Flatbush", "Fort Greene", "Gowanus", "Greenpoint", "Park Slope", "Prospect Heights", "Red Hook", "Sunset Park", "Williamsburg"],
        "Queens": ["Astoria", "Bayside", "College Point", "Corona", "Flushing", "Forest Hills", "Jackson Heights", "Jamaica", "Kew Gardens", "Long Island City", "Maspeth", "Middle Village", "Rego Park", "Ridgewood", "Rockaway Beach", "Sunnyside", "Whitestone", "Woodside"],
        "Bronx": ["Belmont", "Castle Hill", "City Island", "Fordham", "Kingsbridge", "Morris Park", "Mott Haven", "Riverdale", "Throgs Neck", "Tremont", "University Heights", "Woodlawn"],
        "Staten Island": ["Arrochar", "Bay Terrace", "Eltingville", "Great Kills", "New Dorp", "Port Richmond", "St. George", "Stapleton"]
    };

    boroughSelect.addEventListener('change', function() {
        const selectedBorough = this.value;
        neighborhoodSelect.innerHTML = '<option value="" disabled selected>Select a neighborhood</option>';
        if (selectedBorough) {
            neighborhoods[selectedBorough].forEach(neighborhood => {
                const option = document.createElement('option');
                option.value = neighborhood;
                option.textContent = neighborhood;
                neighborhoodSelect.appendChild(option);
            });
            neighborhoodSelect.disabled = false;
        } else {
            neighborhoodSelect.disabled = true;
        }
    });

    function addMessage(content, isBot = false) {
        const messageWrapper = document.createElement('div');
        messageWrapper.className = `message-wrapper ${isBot ? '' : 'message-right'}`;
        messageWrapper.innerHTML = `
            <div class="message ${isBot ? 'bot-message' : 'user-message'}">
                ${content}
            </div>
        `;
        
        messages.appendChild(messageWrapper);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function sendMessage(userInput) {
        const selectedNeighborhood = neighborhoodSelect.value;
        if (!userInput || !selectedNeighborhood) return;

        // Add user message with neighborhood context
        addMessage(`(${selectedNeighborhood}) ${userInput}`, false);

        // Send to server with neighborhood context
        fetch('/chatbot/query/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ query: `In ${selectedNeighborhood}, ${userInput}`, neighborhood: selectedNeighborhood })
        })
        .then(response => response.json())
        .then(data => {
            addMessage(data.response, true);
        })
        .catch(error => {
            addMessage('Sorry, there was an error processing your request.', true);
        });

        input.value = '';
    }

    // Event listeners
    sendBtn.addEventListener('click', () => sendMessage(input.value.trim()));
    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage(input.value.trim());
        }
    });

    quickQuestionButtons.forEach(button => {
        button.addEventListener('click', function() {
            const selectedNeighborhood = neighborhoodSelect.value;
            if (!selectedNeighborhood) {
                alert('Please select a neighborhood first.');
                return;
            }
            const questionType = this.getAttribute('data-question');
            let formattedQuestion = '';

            switch (questionType) {
                case 'walkability':
                    formattedQuestion = `What is the walkability in ${selectedNeighborhood}?`;
                    break;
                case 'crime':
                    formattedQuestion = `What is the crime rate in ${selectedNeighborhood}?`;
                    break;
                case 'trains nearby':
                    formattedQuestion = `What trains are nearby in ${selectedNeighborhood}?`;
                    break;
                case 'schools nearby':
                    formattedQuestion = `What schools are nearby in ${selectedNeighborhood}?`;
                    break;
                case 'restaurants nearby':
                    formattedQuestion = `What are the best restaurants in ${selectedNeighborhood}?`;
                    break;
                default:
                    formattedQuestion = `What is the ${questionType} in ${selectedNeighborhood}?`;
            }

            sendMessage(formattedQuestion);
        });
    });

    // Auto-focus input on page load
    input.focus();
});
</script>
{% endblock %}
