<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Rent Sense</title>
    <style>
        /* Reuse your existing styles from home.html */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            line-height: 1.6;
        }

        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }

        header {
            background: linear-gradient(to right, #2c3e50, #3498db);
            color: #fff;
            padding: 1rem 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .profile-section {
            background: white;
            padding: 2rem;
            margin: 2rem 0;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        .profile-header {
            margin-bottom: 2rem;
        }

        .profile-header h2 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .profile-info {
            display: grid;
            gap: 1rem;
        }

        .info-item {
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .info-label {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .info-value {
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="{% url 'home' %}" style="text-decoration: none; color: white;">
                    <div class="logo">Rent Sense</div>
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <section class="profile-section">
            <div class="profile-header">
                <h2>My Profile</h2>
                <p>Manage your account information</p>
            </div>
            <div class="profile-info">
                <div class="info-item">
                    <div class="info-label">Username</div>
                    <div class="info-value">{{ user.username }}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Email</div>
                    <div class="info-value">{{ user.email }}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Date Joined</div>
                    <div class="info-value">{{ user.date_joined|date:"F j, Y" }}</div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
