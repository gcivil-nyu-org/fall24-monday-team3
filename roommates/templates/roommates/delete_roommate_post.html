<!-- roommates/templates/rentals/delete_apartment_post.html -->

{% extends 'roommates/base.html' %}

{% block title %}Delete Roommate Post{% endblock %}

{% block content %}
<div class="card mt-5">
    <div class="card-header">
        <h2>Confirm Delete</h2>
    </div>
    <div class="card-body">
        <p>Are you sure you want to delete this roommate post?</p>
        <p><strong>{{ roommate_post.name }}</strong></p>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between mt-3">
                <button type="submit" class="btn btn-danger">Confirm Delete</button>
                <a href="{% url 'roommate_detail' pk=roommate_post.pk %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
