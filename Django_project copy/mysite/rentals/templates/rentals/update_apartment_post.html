<!-- rentals/templates/rentals/update_apartment_post.html -->
{% block title %}Edit Apartment Post{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Edit Apartment Post</h1>
    <form method="post" enctype="multipart/form-data" class="border p-4 rounded shadow">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex justify-content-between mt-3">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'delete_apartment_post' post.id %}" class="btn btn-danger">Delete Post</a>
        </div>
    </form>
</div>
{% endblock %}
