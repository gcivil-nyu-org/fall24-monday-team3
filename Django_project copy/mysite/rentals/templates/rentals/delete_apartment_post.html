<!-- rentals/templates/rentals/delete_apartment_post.html -->

{% extends 'rentals/base.html' %}

{% block title %}Delete Apartment Post{% endblock %}

{% block content %}
<div class="card mt-5">
    <div class="card-header">
        <h2>Confirm Delete</h2>
    </div>
    <div class="card-body">
        <p>Are you sure you want to delete this apartment post?</p>
        <p><strong>{{ apartment_post.title }}</strong></p>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between mt-3">
                <button type="submit" class="btn btn-danger">Confirm Delete</button>
                <a href="{% url 'apartment_detail' pk=apartment_post.pk %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
