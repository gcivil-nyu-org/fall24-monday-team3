<!-- rentals/templates/rentals/delete_apartment_post.html -->
{% block title %}Delete Apartment Post{% endblock %}

{% block content %}
<div class="container">
    <h1>Are you sure you want to delete this apartment post?</h1>
    <p>{{ apartment_post.title }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-primary" style="background-color: #ff6666;">Confirm Delete</button>
        <a href="{% url 'apartment_detail' pk=apartment_post.pk %}" class="btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
