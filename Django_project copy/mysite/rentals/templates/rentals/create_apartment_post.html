<!-- rentals/templates/rentals/create_apartment_post.html -->
{% block title %}Create Apartment Post{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Create Apartment Post</h1>

    <!-- Display Messages -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <!-- Create Post Form -->
    <form method="post" enctype="multipart/form-data" class="border p-4 rounded shadow">
        {% csrf_token %}
        {{ post_form.as_p }}
        {{ image_form.as_p }}
        
        <!-- Submit Button -->
        <button type="submit" class="btn btn-success mt-3">Submit</button>
    </form>
</div>
{% endblock %}
