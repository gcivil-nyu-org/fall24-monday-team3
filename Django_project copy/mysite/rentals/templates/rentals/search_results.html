<!-- rentals/templates/rentals/search_results.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Apartments</title>
</head>
<body>
    <form method="get" action="{% url 'search_apartments' %}">
        <input type="text" name="q" placeholder="Search for apartments..." value="{{ query }}">
        <button type="submit">Search</button>
    </form>

    <h2>Search Results</h2>
    <ul>
        {% for apartment in results %}
            <li>
                <a href="{% url 'apartment_detail' apartment.pk %}">
                    {{ apartment.title }} - {{ apartment.address }}
                </a>
            </li>
        {% empty %}
            <li>No results found.</li>
        {% endfor %}
    </ul>
</body>
</html>
