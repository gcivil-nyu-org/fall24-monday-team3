language: python
python:
- '3.9'
install:
- pip install -r requirements.txt
  
script:
#- black --check .
- flake8 --max-line-length=500 .
- coverage run manage.py test --keepdb
before_script:
- find rentals/migrations/ -type f ! -name '__init__.py' -exec rm -f {} +
- rm -rf rentals/migrations/__pycache__
- python manage.py makemigrations
- python manage.py migrate --run-syncdb
after_script:
- coveralls
- echo "Build finished"
- echo "Tring again"


deploy:
- skip_cleanup: 'true'
  provider: elasticbeanstalk
  access_key_id: $AWS_ID
  secret_access_key: $AWS_KEY
  region: us-west-2
  app: django-tutorial-test-before-deploy2
  env: django-tutorial-test-before-deploy2
  bucket_name: elasticbeanstalk-us-west-2-682033502272
  on:
    repo: gcivil-nyu-org/fall24-monday-team3
    branch: test-before-deploy
  

