{% extends 'users/base.html' %}

{% block content %}
<h1>My Price Alerts</h1>

<div class="mb-3">
    <a href="{% url 'add_price_alert' %}" class="btn btn-primary">Add Price Alert</a>
</div>

<table class="table">
    <thead>
        <tr>
            <th>Posting Type</th>
            <th>Max Price</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for alert in alerts %}
        <tr>
            <td>{{ alert.post_type }}</td>
            <td>${{ alert.max_price }}</td>
            <td>
                <a href="{% url 'edit_price_alert' alert.id %}" class="btn btn-sm btn-warning">Edit</a>
                <form method="post" action="{% url 'delete_price_alert' alert.id %}" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this price alert?');">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No price alerts found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
